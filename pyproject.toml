[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "javsp"
description = "汇总多站点数据的AV元数据刮削器"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    {name = "Yuukiy", email = "76897913+Yuukiy@users.noreply.github.com"},
]
requires-python = ">=3.11,<3.16"
dynamic = ["version"]
dependencies = [
    "curl_cffi>=0.15",
    "colorama>=0.4.6",
    "pillow>=12.0",
    "requests>=2.32",
    "tqdm>=4.67",
    # https://stackoverflow.com/questions/446209/possible-values-from-sys-platform
    "pywin32>=311; sys_platform == 'win32'",
    "cryptography>=48.0",
    "pycryptodome>=3.20.0",
    "lxml[html-clean]>=6.0",
    "confz>=2.0.1",
    "pydantic-extra-types>=2.9.0",
    "pendulum>=3.2.0",
]

[project.optional-dependencies]
crop = ["slimeface>=2024.9.27"]
dev = [
    "pytest>=9.0",
    "flake8>=7.0.0",
    "cx-freeze>=8.5",
    "types-lxml>=2026.2",
    "types-pillow>=10.2.0",
    "ruff>=0.13",
]

[project.scripts]
javsp = "javsp.__main__:entry"

[project.urls]
Repository = "https://github.com/Yuukiy/JavSP"
Issues = "https://github.com/Yuukiy/JavSP/issues"
Changelog = "https://github.com/Yuukiy/JavSP/blob/master/CHANGELOG.md"

# ----- hatch 构建配置 -----
# 版本由 git tag 驱动，遵循 PEP 440（dev 版本形如 1.9.2.dev3+gabc1234）
[tool.hatch.version]
source = "vcs"
raw-options = {local_scheme = "no-local-version"}

[tool.hatch.build.targets.wheel]
packages = ["javsp"]

# 将项目根目录下的静态资源打包到 wheel 根目录（安装后位于 site-packages/ 根下）
# 这样 resource_path() 在非 frozen 模式下返回的 Path(__file__).parent.parent / path 即可命中
# 注意：config.yml 为用户配置文件，不在此处打包，由程序在运行目录（CWD/可执行文件目录）查找
[tool.hatch.build.targets.wheel.force-include]
"image" = "image"
"data" = "data"
"config_default.yml" = "config_default.yml"

# sdist 也包含这些静态资源，保证源码包完整
[tool.hatch.build.targets.sdist.force-include]
"image" = "image"
"data" = "data"
"config_default.yml" = "config_default.yml"

# ----- uv 解析配置 -----
# 本地开发可取消注释使用清华源加速；CI 环境在海外，默认使用 PyPI
# [[tool.uv.index]]
# name = "mirrors"
# url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
# default = true

# ----- 工具配置 -----
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["unittest"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",   # module-import-not-at-top-of-file: __main__.py 需要在 import 前初始化编码
]

[tool.ruff.lint.isort]
known-first-party = ["javsp"]
